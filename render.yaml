# Render blueprint for the backend (free web service). Secrets are set in the Render dashboard.
services:
  - type: web
    name: innovation-intelligence-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false        # Supabase connection string (pooler, port 6543)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ALLOWED_ORIGINS
        sync: false        # e.g. https://innovation-intelligence.vercel.app
